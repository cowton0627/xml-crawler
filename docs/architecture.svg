<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="440" viewBox="0 0 1040 440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', 'Noto Sans TC', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-end">
      <path d="M0 0 L10 5 L0 10 z" fill="#86868b"/>
    </marker>
  </defs>

  <!-- panel -->
  <rect x="1" y="1" width="1038" height="438" rx="16" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5"/>

  <!-- title -->
  <text x="40" y="46" font-size="24" font-weight="700" fill="#1d1d1f">xml-crawler<tspan font-weight="400" fill="#1d1d1f">　自架 RSS 產生器</tspan></text>
  <text x="40" y="72" font-size="14" fill="#6e6e73">抓公開內容 → 產生 RSS XML → GitHub Pages 託管 → 雲端 RSS reader 訂閱</text>

  <!-- ===== main flow ===== -->
  <!-- arrows (behind boxes) -->
  <g stroke="#86868b" stroke-width="2" marker-end="url(#arrow)">
    <line x1="188" y1="190" x2="212" y2="190"/>
    <line x1="346" y1="190" x2="370" y2="190"/>
    <line x1="532" y1="190" x2="556" y2="190"/>
    <line x1="684" y1="190" x2="708" y2="190"/>
    <line x1="850" y1="190" x2="874" y2="190"/>
  </g>

  <!-- box1: sources -->
  <rect x="32" y="130" width="156" height="120" rx="10" fill="#f5f5f7" stroke="#d2d2d7"/>
  <text x="110" y="152" font-size="13" font-weight="600" fill="#6e6e73" text-anchor="middle">公開內容</text>
  <circle cx="52" cy="176" r="5" fill="#ff0000"/>
  <text x="66" y="181" font-size="14" fill="#1d1d1f">YouTube</text>
  <circle cx="52" cy="204" r="5" fill="#1d1d1f"/>
  <text x="66" y="209" font-size="14" fill="#1d1d1f">Threads</text>
  <circle cx="52" cy="232" r="5" fill="#e1306c"/>
  <text x="66" y="237" font-size="14" fill="#1d1d1f">Instagram</text>

  <!-- box2: RSSHub -->
  <rect x="212" y="130" width="134" height="120" rx="10" fill="#f5f5f7" stroke="#d2d2d7"/>
  <text x="279" y="180" font-size="16" font-weight="700" fill="#1d1d1f" text-anchor="middle">RSSHub</text>
  <text x="279" y="202" font-size="12" fill="#6e6e73" text-anchor="middle">Docker · :1200</text>
  <text x="279" y="222" font-size="12" fill="#6e6e73" text-anchor="middle">跑平台路由</text>

  <!-- box3: Python -->
  <rect x="370" y="130" width="162" height="120" rx="10" fill="#f5f5f7" stroke="#d2d2d7"/>
  <text x="451" y="176" font-size="16" font-weight="700" fill="#1d1d1f" text-anchor="middle">Python 定時抓取</text>
  <text x="451" y="200" font-size="12" fill="#6e6e73" text-anchor="middle">crawler.py · cron 每 6h</text>
  <text x="451" y="220" font-size="12" fill="#6e6e73" text-anchor="middle">比對 GUID,有變才寫</text>

  <!-- box4: feeds -->
  <rect x="556" y="130" width="128" height="120" rx="10" fill="#f5f5f7" stroke="#d2d2d7"/>
  <text x="620" y="184" font-size="15" font-weight="700" fill="#0071e3" text-anchor="middle">feeds/*.xml</text>
  <text x="620" y="206" font-size="12" fill="#6e6e73" text-anchor="middle">產生的 RSS 檔</text>

  <!-- box5: GitHub Pages -->
  <rect x="708" y="130" width="142" height="120" rx="10" fill="#f5f5f7" stroke="#d2d2d7"/>
  <text x="779" y="180" font-size="16" font-weight="700" fill="#1d1d1f" text-anchor="middle">GitHub Pages</text>
  <text x="779" y="202" font-size="12" fill="#6e6e73" text-anchor="middle">git push</text>
  <text x="779" y="222" font-size="12" fill="#6e6e73" text-anchor="middle">託管 XML</text>

  <!-- box6: RSS reader -->
  <rect x="874" y="130" width="134" height="120" rx="10" fill="#f5f5f7" stroke="#d2d2d7"/>
  <text x="941" y="180" font-size="16" font-weight="700" fill="#1d1d1f" text-anchor="middle">RSS Reader</text>
  <text x="941" y="202" font-size="12" fill="#6e6e73" text-anchor="middle">Feedly /</text>
  <text x="941" y="222" font-size="12" fill="#6e6e73" text-anchor="middle">Inoreader</text>

  <!-- ===== Web UI feeder ===== -->
  <rect x="370" y="330" width="162" height="72" rx="10" fill="#ffffff" stroke="#0071e3" stroke-width="1.5"/>
  <text x="451" y="358" font-size="15" font-weight="700" fill="#0071e3" text-anchor="middle">Web UI</text>
  <text x="451" y="380" font-size="12" fill="#6e6e73" text-anchor="middle">選平台 + @handle</text>
  <text x="451" y="396" font-size="12" fill="#6e6e73" text-anchor="middle">一鍵新增訂閱</text>

  <!-- arrow Web UI -> Python -->
  <line x1="451" y1="330" x2="451" y2="252" stroke="#0071e3" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="463" y="296" font-size="12" fill="#0071e3">寫 config.yaml</text>
</svg>
